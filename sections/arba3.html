<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<title>الأرباع - مرجع الأزهري</title>
<style>
    .page-title {
    text-align: center;
    margin-top: 40px;
    font-size: 28px;
}

body {
    margin: 0;
    direction: rtl;
    font-family: "Cairo", sans-serif;
    background-color: #e8f1ff;
    color: #000000;
}

.arba3-btn {
    text-decoration: none;
    text-align: center;
    padding: 15px;
    background-color: #0a3d62;
    border: solid #08304d 4px;
    color: white;
    border-radius: 8px;
    font-size: 18px;
    transition: 0.3s;
}

.arba3-btn:hover {
    background-color: #1e5f8c;
}

.main-header {
    background: linear-gradient(3deg, #061731, #10449d);
    border: solid #08304d 4px;
    border-radius: 10px;
    color: white;
        padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}
 

.logo-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 49px;
    height: 48px;
    object-fit: contain;
    border-radius: 10px;
}


.main-header h1 {
  font-family: "Amiri", serif;
    font-size: 21px;
    margin: 0;
    letter-spacing: 1px;

}
body.dark-mode {
    background-color: #d7b06e;
    color: #000000;
}

body.dark-mode .arba3-btn {
    background-color: #7e2b05;
    border: solid #000000 5px;
}

body.dark-mode .arba3-btn:hover {
    background-color: #8d5631;
    color: black;
}

body.dark-mode .main-header {
    background: linear-gradient(179deg, #773e2c, #712811);
    border: solid #000000 5px;
        padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}
#mode-toggle {
    font-size: 24px;          /* حجم الأيقونة */
    background: transparent;   /* بدون خلفية */
    border: none;              /* بدون حدود */
    cursor: pointer;
    transition: transform 0.3s, color 0.3s; /* تأثير حركة ولون */
}

/* عند التحويم على الأيقونة */
#mode-toggle:hover {
    transform: rotate(20deg);  /* دوران بسيط عند المرور */
    color: #ffd700;             /* لون ذهبي عند المرور */
}

/* أيقونة القمر في الوضع الليلي */
body.dark-mode #mode-toggle {
    color: #f0e68c; /* لون القمر فاتح */
    text-shadow: 0 0 5px #fff; /* توهج خفيف للقمر */
}

/* أيقونة الشمس في النهاري */
body:not(.dark-mode) #mode-toggle {
    color: #ffdd00; /* لون الشمس أصفر */
    text-shadow: 0 0 3px #fffa8c; /* توهج خفيف للشمس */
}
body.dark-mode .back-btn {
    background: rgb(175, 96, 6);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    font-family: inherit;

}
.back-btn {
    background: rgb(6, 78, 211);
    border: none;
    color: rgb(255, 255, 255);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    font-family: inherit;

}

.arba3-container { 
    display: flex; 
    flex-direction: column; 
    gap: 20px; 
    max-width: 300px;
     margin: 60px auto;
     }

.main-footer {
    background: linear-gradient(135deg, #0f2c59, #1c3f7a);
    padding: 50px 20px;
    text-align: center;
    margin-top: 60px;
    border-top-left-radius: 30px;
    border-top-right-radius: 30px;
    position: relative;
    overflow: hidden;
}

/* Glow خفيف */
.main-footer::before {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
    top: -100px;
    right: -100px;
}

.footer-content {
    max-width: 800px;
    margin: auto;
    color: #fff;
}

/* الدعاء */
.dua {
    font-family: "Amiri", serif;
    font-size: 20px;
    line-height: 2;
    color: #e2e8f0;
    margin-bottom: 25px;
}

/* الخط الفاصل */
.divider {
    width: 60px;
    height: 3px;
    background: #d4af37;
    margin: 20px auto;
    border-radius: 10px;
}

.company a {
    font-size: 24px;
    font-weight: bold;
    text-decoration: none;
    letter-spacing: 1px;

background: linear-gradient(78deg, #fcbd00, #d9c999); 
background-clip: text;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;

    transition: 0.4s;
}

.company a:hover {
    transform: scale(1.07);
    filter: drop-shadow(0 0 8px rgba(0, 132, 255, 0.5));
}
.developer {
    margin-top: 15px;
    font-size: 16px;
    color: #b8ae94;
}

.developer a {
    display: inline-block;
    margin-top: 8px;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;

    background: linear-gradient(45deg, #000000, #ff0000);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    transition: 0.3s;
}

.developer a:hover {
    transform: scale(1.08);
    filter: drop-shadow(0 0 6px rgba(252, 235, 0, 0.6));
}
</style>
</style>
</head>
<body>
<header class="main-header">
<div>
    <button class="back-btn" onclick="goBack()">
        <span style='font-size:16px;'>&#8658;</span>
    </button>
        <button id="mode-toggle">🌙</button>
         </div>
    <h1>مَرجِع الأَزّهَرِي</h1>
    
    <div class="logo-title">
        <img src="../images/logo.png" alt="logo" class="logo">
    </div>

</header>

<h1 class="page-title">الأرباع</h1>

<div class="arba3-container">

    <a href="arba3-kamel.html" class="arba3-btn">
        الأرباع كاملة
    </a>

    <a href="arba3-awal-a5er.html" class="arba3-btn">
        أوائل وأواخر الأرباع
    </a>

</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const modeBtn = document.getElementById("mode-toggle");

    // نرجع آخر وضع محفوظ
    if (localStorage.getItem("mode") === "dark") {
        document.body.classList.add("dark-mode");
        modeBtn.textContent = "☀️";
    } else {
        modeBtn.textContent = "🌙";
    }

    // عند الضغط على الزر
    modeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {
            modeBtn.textContent = "☀️";
            localStorage.setItem("mode", "dark");
        } else {
            modeBtn.textContent = "🌙";
            localStorage.setItem("mode", "light");
        }
    });
});

// زر الرجوع
function goBack() {
    window.history.back();
}
</script>
<footer class="main-footer">

    <div class="footer-content">

        <p class="dua">
            🤍 هذا العمل خالص لوجه الله  
            نسأل الله أن يتقبله منا ومنكم  
            ولا تنسونا من صالح دعائكم 🤲
        </p>

        <div class="divider"></div>

        <p class="company">
            <a href="https://aqta-chi.vercel.app/index.html" target="_blank">
                Al-Qahir Technology
            </a>
        </p>

        <p class="developer">
            Designed & Developed by
            <a href="https://my-website-lake-theta.vercel.app/" target="_blank">
                Islam Ahmed
            </a>
        </p>

    </div>

</footer>
</body>
</html>
