<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../images/logo.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<title>الأرباع - مرجع الأزهري</title>
<style>
    .page-title {
    text-align: center;
    margin-top: 40px;
    font-size: 28px;
}

body {
    margin: 0;
    direction: rtl;
    font-family: "Cairo", sans-serif;
    background-color: #e8f1ff;
    color: #000000;
}

.arba3-btn {
    text-decoration: none;
    text-align: center;
    padding: 15px;
    background-color: #0a3d62;
    border: solid #08304d 4px;
    color: white;
    border-radius: 8px;
    font-size: 18px;
    transition: 0.3s;
}

.arba3-btn:hover {
    background-color: #1e5f8c;
}

.main-header {
    background: linear-gradient(3deg, #061731, #10449d);
    border: solid #08304d 4px;
    border-radius: 10px;
    color: white;
        padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}
 

.logo-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 49px;
    height: 48px;
    object-fit: contain;
    border-radius: 10px;
}


.main-header h1 {
  font-family: "Amiri", serif;
    font-size: 21px;
    margin: 0;
    letter-spacing: 1px;

}
body.dark-mode {
    background-color: #d7b06e;
    color: #000000;
}

body.dark-mode .arba3-btn {
    background-color: #7e2b05;
    border: solid #000000 5px;
}

body.dark-mode .arba3-btn:hover {
    background-color: #8d5631;
    color: black;
}

body.dark-mode .main-header {
    background: linear-gradient(179deg, #773e2c, #712811);
    border: solid #000000 5px;
        padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}
#mode-toggle {
    font-size: 24px;          /* حجم الأيقونة */
    background: transparent;   /* بدون خلفية */
    border: none;              /* بدون حدود */
    cursor: pointer;
    transition: transform 0.3s, color 0.3s; /* تأثير حركة ولون */
}

/* عند التحويم على الأيقونة */
#mode-toggle:hover {
    transform: rotate(20deg);  /* دوران بسيط عند المرور */
    color: #ffd700;             /* لون ذهبي عند المرور */
}

/* أيقونة القمر في الوضع الليلي */
body.dark-mode #mode-toggle {
    color: #f0e68c; /* لون القمر فاتح */
    text-shadow: 0 0 5px #fff; /* توهج خفيف للقمر */
}

/* أيقونة الشمس في النهاري */
body:not(.dark-mode) #mode-toggle {
    color: #ffdd00; /* لون الشمس أصفر */
    text-shadow: 0 0 3px #fffa8c; /* توهج خفيف للشمس */
}
body.dark-mode .back-btn {
    background: rgb(175, 96, 6);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    font-family: inherit;

}
.back-btn {
    background: rgb(6, 78, 211);
    border: none;
    color: rgb(255, 255, 255);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    font-family: inherit;

}

.arba3-container { 
    display: flex; 
    flex-direction: column; 
    gap: 20px; 
    max-width: 300px;
     margin: 60px auto;
     }

</style>
</head>
<body>
<header class="main-header">
<div>
    <button class="back-btn" onclick="goBack()">
        <span style='font-size:16px;'>&#8658;</span>
    </button>
        <button id="mode-toggle">🌙</button>
         </div>
    <h1>مَرجِع الأَزّهَرِي</h1>
    
    <div class="logo-title">
        <img src="../images/logo.png" alt="logo" class="logo">
    </div>

</header>

<h1 class="page-title">الأرباع</h1>

<div class="arba3-container">

    <a href="arba3-kamel.html" class="arba3-btn">
        الأرباع كاملة
    </a>

    <a href="arba3-awal-a5er.html" class="arba3-btn">
        أوائل وأواخر الأرباع
    </a>

</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const modeBtn = document.getElementById("mode-toggle");

    // نرجع آخر وضع محفوظ
    if (localStorage.getItem("mode") === "dark") {
        document.body.classList.add("dark-mode");
        modeBtn.textContent = "☀️";
    } else {
        modeBtn.textContent = "🌙";
    }

    // عند الضغط على الزر
    modeBtn.addEventListener("click", () => {
        document.body.classList.toggle("dark-mode");

        if (document.body.classList.contains("dark-mode")) {
            modeBtn.textContent = "☀️";
            localStorage.setItem("mode", "dark");
        } else {
            modeBtn.textContent = "🌙";
            localStorage.setItem("mode", "light");
        }
    });
});

// زر الرجوع
function goBack() {
    window.history.back();
}
</script>
</body>
</html>
