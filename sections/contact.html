<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تواصل معنا</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/levels.css">
  <style>
    body {
  font-family: 'Cairo', sans-serif;
  margin: 0;
  background: #f9fbff;
  color: #0b2c4d;
}

.contact-page {
  padding: 80px 10%;
  text-align: center;
}

.contact-page h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.contact-page p {
  font-size: 18px;
  color: #555;
  margin-bottom: 40px;
}

.contact-info {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 40px;
  margin-bottom: 50px;
}

.contact-item {
  display: flex;
  align-items: center;
  gap: 15px;
  font-size: 18px;
  background: #fff;
  padding: 15px 25px;
  border-radius: 12px;
  box-shadow: 0 8px 20px rgba(2, 9, 77, 0.705);
  transition: 0.3s;
}

.contact-item img {
  width: 28px;
}

.contact-item:hover {
  transform: translateY(-5px);
}

.socials {
  margin-bottom: 50px;
}

.socials a {
  margin: 0 10px;
  display: inline-block;
  transition: transform 0.3s;
}

.socials a img {
  width: 40px;
}

.socials a:hover {
  transform: scale(1.2);
}

.contact-form h2 {
  font-size: 28px;
  margin-bottom: 20px;
}

.contact-form form {
  display: flex;
  flex-direction: column;
  gap: 15px;
  max-width: 500px;
  margin: 0 auto;
}

.contact-form input,
.contact-form textarea {
  padding: 12px 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  font-size: 16px;
  width: 100%;
}

.contact-form textarea {
  min-height: 120px;
  resize: none;
}

.contact-form button {
  padding: 12px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background-color: #1e5fa3;
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  transition: 0.3s;
}

.contact-form button:hover {
  background-color: #14477c;
}

/* ======= SOCIAL ICONS ======= */
.social-icons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
  margin-top: 30px;
}

.social-icons a {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  background-color: #f0f0f0;
  color: #0b2c4d;
  padding: 12px 18px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  transition: all 0.3s ease;
  box-shadow: 0 6px 15px rgba(0,0,0,0.08);
}

.social-icons a i {
  font-size: 20px;
}

/* Hover effect */
.social-icons a:hover {
  transform: translateY(-4px);
  background-color: #1e5fa3;
  color: #fff;
  box-shadow: 0 10px 20px rgba(0,0,0,0.15);
}

/* Adjust for smaller screens */
@media (max-width: 600px) {
  .social-icons {
    flex-direction: column;
    gap: 15px;
  }
}

  </style>
</head>
<body>
 <header class="main-header">
  <div class="container">

    <!-- Logo -->
    <div class="logo">
      <img src="/images/logo.png" alt="Logo">
      <span>مَرجِع الأَزّهَرِي</span>
    </div>

    <!-- Navigation -->
    <nav class="nav">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#levels">الكورسات</a>
      <a href="#">عن المنصة</a>
      <a href="contact.html">تواصل معنا</a>
    </nav>

    <!-- Actions -->
    <div class="actions">
      <button class="btn login">تسجيل دخول</button>
      <button class="btn signup">إنشاء حساب</button>
    </div>

    <!-- Mobile Menu Icon -->
    <div class="menu-icon" id="menuToggle">
      ☰
    </div>

  </div>
</header>

<section class="contact-page">
  <h1>تواصل معنا</h1>
  <p>نحن هنا لمساعدتك. يمكنك الاتصال بنا عبر أي من الطرق التالية:</p>

  <section id="contact" class="contact-section">
    <h2>تواصل معنا</h2>
    <div class="social-icons">
      <a href=" https://wa.me/message/C44VX33AW5D4P1"><i class="fab fa-whatsapp"></i> واتساب</a>
      <a href="https://www.facebook.com/al.qahir.ta?mibextid=kFxxJD"><i class="fab fa-facebook"></i> فيسبوك</a>
      <a href="https://www.instagram.com/al.qahir.ta?igsh=MWpuOXZ1Mjd6bHMybw=="><i class="fab fa-instagram"></i> انستجرام</a>
      <a href="https://www.tiktok.com/@al__qahir?_t=ZS-8wqgnSgRBHs&_r=1"><i class="fab fa-tiktok"></i> تيك توك</a>
      <a href="mailto:al.qahir.ta@gmail.com"><i class="fas fa-envelope"></i> جيميل</a>
    </div>
  </section>
  <div class="contact-form">
    <h2>أرسل لنا رسالة</h2>
    <form>
      <input type="text" placeholder="الاسم" required>
      <input type="email" placeholder="البريد الإلكتروني" required>
      <textarea placeholder="رسالتك" required></textarea>
      <button type="submit">إرسال</button>
    </form>
  </div>
</section>

</body>
</html>
