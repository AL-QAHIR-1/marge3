<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض السورة</title>

<link rel="icon" href="../images/logo.png" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">

<style>
html, body {
    height:100%;
}

body{
    margin:0;
    font-family:"Cairo",sans-serif;
    transition:.3s;
    display:flex;
    flex-direction:column;
}

.viewer-header{
    flex-shrink:0;
}

#pdf-container{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

body.light{ background:#f4f6fb; }

.viewer-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:linear-gradient(135deg,#0f2c59,#1c3f7a);
    color:white;
}

.right-section{ display:flex; align-items:center; gap:10px; }
.logo{ width:40px; height:40px; object-fit:contain; }
.site-title{ font-size:18px; margin:0; }

.surah-name{
    font-family:"Amiri",serif;
    font-size:22px;
    margin:0;
}

.left-section{ display:flex; gap:10px; }

.left-section button{
    background:#af6006;
    border:none;
    color:white;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
}


.ashom{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:25px;
    background:rgba(9,42,92,.35);
    padding:8px 20px;
    border-radius:18px;
    backdrop-filter:blur(6px);
    z-index:1000;
}

.ashom button{
    background:#092463;
    border:none;
    color:#fff;
    font-size:16px;
    width:38px;
    height:38px;
    border-radius:50%;
    cursor:pointer;
    transition:.2s;
}

.ashom button:hover{
    background:#123a85;
}

.page-box{
    display: flex;
    align-items: flex-end;
    gap: 0px;
    background: #226bdb00;
    padding: 0px 18px;
    border-radius: 18px;
    font-weight: 600;
    border: solid;
    flex-direction: row;
    justify-content: space-between;
}

.page-box input{
    width: 45px;
    border: none;
    color: white;
    font-weight: bold;
    font-size: 16px;
    margin: 0px;
    background: #1c3f7a00;
}

.page-box span{
    color: #000000;
    font-size: 13px;
}

#page-img{
    max-width:100%;
    max-height:100%;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    transition:opacity .25s ease;
}

.finish-message{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:3000;
    opacity:0;
    visibility:hidden;
    transition:opacity .3s ease;
    color:#1d3b2a;
direction:rtl;
}

.finish-message.active{
    opacity:1;
    visibility:visible;
}

.finish-message .box{
    background:#fdfaf3;
    width:90%;
    max-width:340px;
    padding:25px 20px;
    border-radius:16px;
    text-align:center;
    border:2px solid #c7a84a;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
    animation:fadeInScale .3s ease;
}

@keyframes fadeInScale{
    from{transform:scale(.8);opacity:0}
    to{transform:scale(1);opacity:1}
}

.finish-message h3{
    font-family:"Amiri",serif;
    font-size:20px;
    margin-bottom:18px;
    color:#1d3b2a;
}

.finish-message button{
    background:#1d3b2a;
    color:#fff;
    border:none;
    padding:8px 20px;
    border-radius:25px;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}

.finish-message button:hover{
    background:#2e5c43;
box-shadow:0 8px 20px rgba(175,96,6,0.5);
}
.progress-wrapper{
    width:100%;
    height:6px;
    background:#dcdcdc;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#0f2c59,#1c3f7a);
    transition:width .3s ease;
}
.progress-wrapper{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:5px;
    background:rgba(0,0,0,.1);
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#0f2c59,#1c3f7a);
    transition:width .3s ease;
}

</style>
</head>

<body class="light">

//التنقل 
function renderPage(num){

    if(num < surah.start) num = surah.start;
    if(num > surah.end) num = surah.end;

    pageNum = num;

    imgElement.style.opacity = 0;

    let fileName = String(pageNum).padStart(3,'0') + ".jpg";
    imgElement.src = "../mushaf-images/" + fileName;

    imgElement.onload = () => {

        imgElement.style.opacity = 1;

        updatePageBox();
        updateProgress();
    };

    localStorage.setItem("lastPage"+surahId, pageNum);

    preloadNext();
}
function updatePageBox(){

    document.getElementById("pageInput").value = pageNum;
    document.getElementById("totalPages").textContent =
    "/" + surah.end;
}function updateProgress(){

    let total = surah.end - surah.start + 1;
    let current = pageNum - surah.start + 1;

    let percent = (current / total) * 100;

    document.getElementById("progressBar").style.width =
    percent + "%";
}
document.getElementById("pageInput")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        let value = parseInt(this.value);
        if(!isNaN(value)){
            renderPage(value);
        }
    }
});
