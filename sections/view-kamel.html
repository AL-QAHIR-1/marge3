<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض السورة</title>
  <link rel="icon" href="../images/logo.png" type="image/png">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:"Cairo",sans-serif;
    transition:.3s;
    overflow:hidden;
}

body.light{
    background:#f4f6fb;
}

body.dark{
    background:#111;
}

.viewer-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 20px;
    background:linear-gradient(135deg,#0f2c59,#1c3f7a);
    color:white;
}

/* يمين */
.right-section{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:40px;
    height:40px;
    object-fit:contain;
}

.site-title{
    font-size:18px;
    margin:0;
}

/* المنتصف */
.surah-name{
    font-family:"Amiri",serif;
    font-size:22px;
    margin:0;
}

/* شمال */
.left-section{
    display:flex;
    gap:10px;
}

.left-section button{
    background:#af6006;
    border:none;
    color:white;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    transition:.3s;
}

.left-section button:hover{
    opacity:.8;
}

body.light .viewer-header{
    background:linear-gradient(135deg,#0f2c59,#1c3f7a);
}

body.dark .viewer-header{
    background:#673f12;
}

.controls button{
    background:#af6006;
    border:none;
    padding:6px 12px;
    color:white;
    border-radius:8px;
    cursor:pointer;
    margin-left:5px;
}

.ashom{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
    background:rgba(15,44,89,0.9);
    padding:10px 20px;
    border-radius:50px;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
    backdrop-filter:blur(6px);
    z-index:1000;
}

.ashom button{
    background:#af6006;
    border:none;
    color:white;
    font-size:20px;
    width:45px;
    height:45px;
    border-radius:50%;
    cursor:pointer;
    transition:all .3s ease;
}

.ashom button:hover{
    background:#d47b0c;
    transform:scale(1.1);
}

.ashom button:active{
    transform:scale(.95);
}
/* عرض PDF */
#pdf-container{
    height:calc(100vh - 60px);
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

canvas{
    max-width:100%;
    max-height:100%;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

/* رسالة الانتقال */
.finish-message{
    position:absolute;
    top:50%;
    left:20px;
    transform:translateY(-50%);
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    width:260px;
    display:none;
}

.finish-message h3{
    margin-top:0;
    color:#0f2c59;
}

.finish-message button{
    background:#0f2c59;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    margin-top:10px;
}
</style>
</head>

<body class="light">
<div id="loader" style="display:none;text-align:center;padding:15px;">
جارٍ تحميل الصفحة...
</div>
<div class="viewer-header">
    
 <!-- شمال: الأزرار -->
    <div class="left-section">
        <button class="back-btn" onclick="goBack()">↩</button>
        <button class="mode-btn" onclick="toggleMode()">🌙</button>
        
    </div>

    

    <!-- المنتصف: اسم السورة -->
    <h2 id="surah-name" class="surah-name"></h2>

<!-- يمين: اللوجو + اسم الموقع -->
    <div class="right-section">
        <img src="../images/logo.png" alt="logo" class="logo">
        <h1 class="site-title">مَرجِع الأَزّهَرِي</h1>
    </div>
   
</div>

<div class="ashom">
 <button onclick="prevPage()">▶</button>
        <button onclick="nextPage()">◀</button></div>
<div id="pdf-container">
    <canvas id="pdf-render"></canvas>

    <div class="finish-message" id="finishBox">
        <h3 id="nextSurahName"></h3>
        <button onclick="goNextSurah()">قراءة</button>
    </div>
</div>

/* ===== قراءة ID ===== */
const urlParams = new URLSearchParams(window.location.search);
let surahId = parseInt(urlParams.get("id"));
let surah = surahs[surahId];

if(!surah){
  alert("السورة غير موجودة");
}

/* ===== عرض اسم السورة ===== */
document.getElementById("surah-name").textContent = surah.name;

/* ===== ملفات PDF ===== */
let dayPDF = "../pdf/mushaf-day.pdf";
let nightPDF = "../pdf/mushaf-day.pdf";
let currentPDF = dayPDF;

/* ===== متغيرات عامة ===== */
let pdfDoc = null;
let loadingTask = null;
let pageNum = parseInt(localStorage.getItem("lastPage"+surahId)) || surah.start;

let canvas = document.getElementById("pdf-render");
let ctx = canvas.getContext("2d");

/* ===== Loader ===== */
function showLoader(){
  document.getElementById("loader").style.display = "block";
}
function hideLoader(){
  document.getElementById("loader").style.display = "none";
}

/* ===== تحميل PDF (Streaming) ===== */
function loadPDF(){

    showLoader();

    if (loadingTask) {
        loadingTask.destroy();
    }

    loadingTask = pdfjsLib.getDocument({
        url: currentPDF,
        disableStream: false,
        disableAutoFetch: false,
        rangeChunkSize: 65536
    });

    loadingTask.promise.then(pdf=>{
        pdfDoc = pdf;
        renderPage(pageNum);
    }).catch(err=>{
        console.error(err);
        alert("فشل تحميل المصحف");
    });
}

loadPDF();

/* ===== عرض صفحة ===== */
function renderPage(num){

    if(num < surah.start) num = surah.start;
    if(num > surah.end) num = surah.end;

    pageNum = num;

    showLoader();

    pdfDoc.getPage(pageNum).then(page=>{

        let scale = window.innerWidth < 768 ? 1.0 : 1.4;
        const viewport = page.getViewport({ scale: scale });

        canvas.height = viewport.height;
        canvas.width = viewport.width;

        page.render({
            canvasContext: ctx,
            viewport: viewport
        }).promise.then(()=>{

            localStorage.setItem("lastPage"+surahId, pageNum);
            hideLoader();

        });

    });

}

/* ===== الصفحة التالية ===== */
function nextPage(){
    if(pageNum < surah.end){
        renderPage(pageNum + 1);
    }else{
        showNextSurah();
    }
}

/* ===== الصفحة السابقة ===== */
function prevPage(){
    if(pageNum > surah.start){
        renderPage(pageNum - 1);
    }
}

/* ===== سحب باللمس ===== */
let startX = 0;

document.addEventListener("touchstart", e=>{
    startX = e.changedTouches[0].screenX;
});

document.addEventListener("touchend", e=>{
    let endX = e.changedTouches[0].screenX;

    if(endX < startX - 50) nextPage();
    if(endX > startX + 50) prevPage();
});

/* ===== الانتقال للسورة التالية ===== */
function showNextSurah(){
    let nextId = surahId + 1;
    if(surahs[nextId]){
        document.getElementById("nextSurahName").textContent =
        "الانتقال إلى سورة " + surahs[nextId].name;
        document.getElementById("finishBox").style.display="block";
    }
}

function goNextSurah(){
    window.location.href = "view-kamel.html?id=" + (surahId + 1);
}

/* ===== الوضع الليلي ===== */
function toggleMode(){

    let body = document.body;
    body.classList.toggle("dark");
    body.classList.toggle("light");

    currentPDF = body.classList.contains("dark") ? nightPDF : dayPDF;

    loadPDF();
}

/* ===== زر الرجوع ===== */
function goBack(){
    window.history.back();
}
