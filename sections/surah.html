<title>عرض الايات القرائنية</title>

<style>
    body {
    background: linear-gradient(to bottom, #f8f3e6, #ffffff);
}

.ayah-container p {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    transition: 0.3s ease;
     border: solid 7px rgb(38, 62, 128);
}
.dark-mode .ayah-container p {
  background: #d0ff9a;
    padding: 15px;
    border-radius: 10px;
    transition: 0.3s ease;
    border: solid 7px;
}

.ayah-container p:hover {
    background: #f3e9d2;
    transform: scale(1.02);
}
.dark-mode .ayah-container p:hover {
    background: #c2e896;
    transform: scale(1.02);
}
/* عنوان السورة */
#surah-title {
    font-family: 'Amiri', serif;
    font-size: 34px;
    text-align: center;
    margin: 30px 0;
    color: #0044ff;
}
.dark-mode #surah-title {
    font-family: 'Amiri', serif;
    font-size: 34px;
    text-align: center;
    margin: 30px 0;
    color: #000000;
}

/* صندوق الآيات */
.ayah-container {
    max-width: 800px;
    margin: auto;
    background: #fdfaf3;
    border-radius: 15px;
    box-shadow: 2px 1px 25px 4px rgb(0 0 0);
}
.dark-mode .ayah-container {
    max-width: 800px;
    margin: auto;
    background: #f8cc83;
    border-radius: 15px;
    box-shadow: 2px 1px 25px 4px rgb(0 0 0);
}

/* تنسيق كل آية */
.ayah-container p {
    font-family: 'Amiri', serif;
    line-height: 2.2;
    text-align: center;
    margin-bottom: 18px;
    color: #222;
    direction: rtl;
}

.dark-mode .ayah-container p {
    font-family: 'Amiri', serif;
    line-height: 2.2;
    text-align: center;
    margin-bottom: 18px;
    color: #012102;
    direction: rtl;
}
/* أرقام الآيات */
.ayah-container p span {
    color: #7a0000;
    font-size: 18px;
    margin-right: 5px;
}

/* موبايل */
@media (max-width: 600px) {
    .ayah-container {
        padding: 15px;
    }

    .ayah-container p {
        font-size: 22px;
    }
}
:root {
    --bg-color: #f9f9f9;
    --text-color: #0f2c59;
    --card-bg: rgba(230,232,243,0.6);
    --btn-bg: #0f2c59;
    --btn-saved: rgb(175,96,6);
    --progress-bg: #ddd;
    --progress-fill: linear-gradient(90deg,#0f2c59,#af6006);
}

body {
    font-family: 'Cairo', sans-serif;
    margin:0; padding:0;
    background: var(--bg-color);
    color: var(--text-color);
    transition: 0.3s;
}

.section-title { text-align:center; font-family:"Amiri", serif; font-size:30px; margin-bottom:40px; }
.surah-list { max-width:700px; margin:auto; }
.surah-item {
    background: var(--card-bg); padding:20px; margin-bottom:20px; border-radius:18px;
    display:flex; align-items:center; justify-content:space-between; flex-direction:row; box-shadow:0 8px 20px rgba(0,0,0,0.32);
    border:1px solid #eee; border-right:dashed; direction:rtl;
}
.surah-item span, .surah-name { font-size:18px; font-weight:600; text-decoration:none; color:var(--text-color); transition:0.3s; }
.surah-name:hover { color:#d4af37; }
.surah-item button {
    background: var(--btn-bg); color:white; border:none; padding:8px 18px; border-radius:20px; cursor:pointer; transition:0.3s; font-family:system-ui;
}
.surah-item button.saved { background: var(--btn-saved); color:white; }
.progress-box { margin:20px 0; }
.progress-info { display:flex; justify-content:space-between; margin-bottom:6px; font-weight:bold; }
.progress-bar { width:100%; height:12px; background: var(--progress-bg); border-radius:20px; overflow:hidden; }
.progress-fill { height:100%; width:0%; background: var(--progress-fill); transition:0.4s; }

body.dark-mode .main-header {
    background: linear-gradient(179deg, #773e2c, #712811);
    border: solid #000000 5px;
        padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    flex-direction: row;
}
#mode-toggle {
    font-size: 24px;          /* حجم الأيقونة */
    background: transparent;   /* بدون خلفية */
    border: none;              /* بدون حدود */
    cursor: pointer;
    transition: transform 0.3s, color 0.3s; /* تأثير حركة ولون */
}

/* عند التحويم على الأيقونة */
#mode-toggle:hover {
    transform: rotate(20deg);  /* دوران بسيط عند المرور */
    color: #ffd700;             /* لون ذهبي عند المرور */
}

/* أيقونة القمر في الوضع الليلي */
body.dark-mode #mode-toggle {
    color: #f0e68c; /* لون القمر فاتح */
    text-shadow: 0 0 5px #fff; /* توهج خفيف للقمر */
}

/* أيقونة الشمس في النهاري */
body:not(.dark-mode) #mode-toggle {
    color: #ffdd00; /* لون الشمس أصفر */
    text-shadow: 0 0 3px #fffa8c; /* توهج خفيف للشمس */
}
body.dark-mode .back-btn {
    background: rgb(175, 96, 6);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    font-family: inherit;

}
.back-btn {
    background: rgb(6, 78, 211);
    border: none;
    color: rgb(255, 255, 255);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    font-family: inherit;

}

.main-header {
    background: linear-gradient(3deg, #061731, #10449d);
    border-radius: 10px;
    color: white;
        padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    flex-direction: row;
}
 

.logo-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 49px;
    height: 48px;
    object-fit: contain;
    border-radius: 10px;
}


.main-header h1 {
  font-family: "Amiri", serif;
    font-size: 21px;
    margin: 0;
    letter-spacing: 1px;

}
.main-footer {
    background: linear-gradient(135deg, #0f2c59, #1c3f7a);
    padding: 50px 20px;
    text-align: center;
    margin-top: 60px;
    border-top-left-radius: 30px;
    border-top-right-radius: 30px;
    position: relative;
    overflow: hidden;
}

/* Glow خفيف */
.main-footer::before {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
    top: -100px;
    right: -100px;
}

.footer-content {
    max-width: 800px;
    margin: auto;
    color: #fff;
}

/* الدعاء */
.dua {
    font-family: "Amiri", serif;
    font-size: 20px;
    line-height: 2;
    color: #e2e8f0;
    margin-bottom: 25px;
}

/* الخط الفاصل */
.divider {
    width: 60px;
    height: 3px;
    background: #d4af37;
    margin: 20px auto;
    border-radius: 10px;
}

.company a {
    font-size: 24px;
    font-weight: bold;
    text-decoration: none;
    letter-spacing: 1px;

background: linear-gradient(78deg, #fcbd00, #d9c999); 
background-clip: text;
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;

    transition: 0.4s;
}

.company a:hover {
    transform: scale(1.07);

}
.developer {
    margin-top: 15px;

    color: #b8ae94;
}

.developer a {
    display: inline-block;
    margin-top: 8px;
    font-size: 20px;
    font-weight: bold;
    text-decoration: none;

    background: linear-gradient(45deg, #000000, #ff0000);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    transition: 0.3s;
}

.developer a:hover {
    transform: scale(1.08);
    filter: drop-shadow(0 0 6px rgba(252, 235, 0, 0.6));
}
</style>

وَلَا ٱلضَّآلِّينَ (7)</p>`;

    }if (surahId == 4) {
