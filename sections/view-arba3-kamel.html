<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض الربع</title>
<link rel="stylesheet" href="../css/style.css">
<!-- PhotoSwipe CSS -->
<link rel="stylesheet" href="https://unpkg.com/photoswipe@5/dist/photoswipe.css">

<style>
body {
    font-family: 'Cairo', sans-serif;
    margin: 0;
    background: #f3f6fb;
}
body.dark-mode .main-header {
    background: linear-gradient(179deg, #773e2c, #712811);
    border: solid #000000 5px;
        padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    flex-direction: row;
}
#mode-toggle {
    font-size: 24px;          /* حجم الأيقونة */
    background: transparent;   /* بدون خلفية */
    border: none;              /* بدون حدود */
    cursor: pointer;
    transition: transform 0.3s, color 0.3s; /* تأثير حركة ولون */
}

/* عند التحويم على الأيقونة */
#mode-toggle:hover {
    transform: rotate(20deg);  /* دوران بسيط عند المرور */
    color: #ffd700;             /* لون ذهبي عند المرور */
}

/* أيقونة القمر في الوضع الليلي */
body.dark-mode #mode-toggle {
    color: #f0e68c; /* لون القمر فاتح */
    text-shadow: 0 0 5px #fff; /* توهج خفيف للقمر */
}

/* أيقونة الشمس في النهاري */
body:not(.dark-mode) #mode-toggle {
    color: #ffdd00; /* لون الشمس أصفر */
    text-shadow: 0 0 3px #fffa8c; /* توهج خفيف للشمس */
}
body.dark-mode .back-btn {
    background: rgb(175, 96, 6);
    border: none;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    font-family: inherit;

}
.back-btn {
    background: rgb(6, 78, 211);
    border: none;
    color: rgb(255, 255, 255);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    font-family: inherit;

}

.main-header {
    background: linear-gradient(3deg, #061731, #10449d);
    border-radius: 10px;
    color: white;
        padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
    flex-direction: row;
}
 

.logo-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 49px;
    height: 48px;
    object-fit: contain;
    border-radius: 10px;
}


.main-header h1 {
  font-family: "Amiri", serif;
    font-size: 21px;
    margin: 0;
    letter-spacing: 1px;

}
/* ===== Title ===== */
#title {
    text-align: center;
    margin: 20px;
    font-family: "Amiri", serif;
}

/* ===== Gallery ===== */
.gallery {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
}

.gallery img {
    width: 100%;
    max-width: 600px;
    margin-bottom: 15px;
    border-radius: 12px;
    cursor: pointer;
}


</style>
</head>

<body>

<!-- ===== HEADER ===== -->
<header class="main-header">
<div>
    <button class="back-btn" onclick="goBack()">↩</button>
    <button id="mode-toggle">🌙</button>
</div>

<h1>مَرجِع الأَزّهَرِي</h1>

<div>
    <img src="../images/logo.png" class="logo">
</div>
</header>

<h2 id="title">جاري التحميل...</h2>

<!-- ===== GALLERY ===== -->
<div class="gallery" id="gallery"></div>

<!-- ===== JS ===== -->
<script>

// ===== رجوع =====
function goBack(){
    history.back();
}

// ===== Dark Mode =====
const modeBtn = document.getElementById("mode-toggle");

if(localStorage.getItem("mode") === "dark"){
    document.body.classList.add("dark-mode");
    modeBtn.textContent = "☀️";
}

modeBtn.onclick = () => {
    document.body.classList.toggle("dark-mode");

    if(document.body.classList.contains("dark-mode")){
        localStorage.setItem("mode","dark");
        modeBtn.textContent = "☀️";
    } else {
        localStorage.setItem("mode","light");
        modeBtn.textContent = "🌙";
    }
};

// ===== قراءة ID =====
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// ===== تحويل اسم الربع =====
function getRubaName(id){
    const match = id.match(/r(\d+)/);
    if(!match) return id;

    const names = [
        "الأول","الثاني","الثالث","الرابع",
        "الخامس","السادس","السابع","الثامن"
    ];

    return "الربع " + names[match[1]-1];
}

// ===== عرض العنوان =====
document.getElementById("title").textContent = getRubaName(id);

// ===== تحميل الصور بشكل ذكي (بدون عدد ثابت) =====
function loadImages(juz, ruba) {
    const container = document.getElementById("gallery");
    let i = 1;

    function tryLoad() {
        const src = `../images/arba3/j${juz}-r${ruba}/${i}.jpg`;

        const imgTest = new Image();

        imgTest.onload = function () {
            const link = document.createElement("a");
            link.href = src;
            link.dataset.pswpWidth = "1200";
            link.dataset.pswpHeight = "1800";

            const img = document.createElement("img");
            img.src = src;
            img.loading = "lazy"; // 🚀 Lazy Loading

            link.appendChild(img);
            container.appendChild(link);

            i++;
            tryLoad(); // يكمل للصورة اللي بعدها
        };

        imgTest.onerror = function () {
            if(i === 1){
                container.innerHTML = "<p>⚠️ لا يوجد صور لهذا الربع</p>";
            }
            // أول صورة تقع → يوقف
        };

        imgTest.src = src;
    }

    tryLoad();
}

// ===== استخراج الجزء والربع =====
const match = id && id.match(/j(\d+)-r(\d+)/);

if(match){
    const juz = match[1];
    const ruba = match[2];

    loadImages(juz, ruba);
} else {
    document.getElementById("gallery").innerHTML = "<p>⚠️ رابط غير صحيح</p>";
}

</script>

<!-- ===== PhotoSwipe ===== -->
<script type="module">
import PhotoSwipeLightbox from 'https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.min.js';

const lightbox = new PhotoSwipeLightbox({
  gallery: '#gallery',
  children: 'a',
  pswpModule: () => import('https://unpkg.com/photoswipe@5/dist/photoswipe.esm.min.js')
});

lightbox.init();
</script>
</body>
</html>
