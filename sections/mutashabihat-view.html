<style>

body{
    margin:0;
    font-family: "Amiri", serif;
    background:#f4f6fb;
    direction: rtl;
}

/* الهيدر */
   .main-header {
    background: linear-gradient(135deg, #0f2c59, #1c3f7a);
    color: white;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-direction: row;
    font-family:'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}

.logo-title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 49px;
    height: 48px;
    object-fit: contain;
    border-radius: 10px;
}


.main-header h1 {
  font-family: "Amiri", serif;
    font-size: 21px;
    margin: 0;
    letter-spacing: 1px;
}

.back-btn {
    background: rgb(175, 96, 6);
    border: none;
    color: white;
    padding: 11px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
    font-family: inherit;

}

.back-btn:hover {
    background: rgba(255, 251, 251, 0.699);
    color: black;
}


.back-btn{
    background:#af6006;
    border:none;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
}

/* الصور */
.gallery{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.image-card{
    margin-bottom:30px;
    background:white;
    padding:15px;
    border-radius:20px;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.image-wrapper{
    overflow:hidden;
    border-radius:15px;
}

.image-wrapper img{
    width:100%;
    height:auto;
    display:block;
    cursor: zoom-in;
    transition: transform 0.3s ease;
}

/* زر التحميل */
.download-btn{
    margin-top:10px;
    display:inline-block;
    background:#0f2c59;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    text-decoration:none;
    font-size:14px;
}

.download-btn:hover{
    background:#af6006;
}
.image-card img{
    width: 100%;
    height: auto;
    display: block;
    border-radius: 15px;
    border-radius:15px;
    transition:0.3s;
}

.image-card img:hover{
    transform:scale(1.02);
}
.image-wrapper {
    position: relative;
    min-height: 300px;
}

.loader {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 12px;
    background: #fff;
    z-index: 2;
    
}

body.dark .loader {
    background: #111;
    color: #fff;
}

.spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #ddd;
    border-top: 4px solid #2c7a7b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.image-wrapper img {
    width: 100%;
    display: none;
}
</style>

if (gallery && images[surahId]) {

    const imagePromises = images[surahId].map(src => {
        return new Promise(resolve => {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                resolve({
                    src: src,
                    width: img.naturalWidth,
                    height: img.naturalHeight
                });
            };
        });
    });

    Promise.all(imagePromises).then(results => {

        results.forEach(item => {

            const card = document.createElement("div");
            card.className = "image-card";

            const link = document.createElement("a");
            link.href = item.src;
            link.setAttribute("data-pswp-width", item.width);
            link.setAttribute("data-pswp-height", item.height);

            const img = document.createElement("img");
            img.src = item.src;

            link.appendChild(img);

    

            card.appendChild(link);
        

            gallery.appendChild(card);
        });

    });

} else {
    gallery.innerHTML = "<p>لا توجد متشابهات لهذه الصور☺</p>";
}


const img = document.getElementById("mutashabihatImage");
const loader = document.querySelector(".loader");

function loadImage(src) {
loader.remove();
    img.style.display = "none";

    img.src = src;

    // لو الصورة اتحملت من الكاش
    if (img.complete) {
        hideLoader();
    }
}

function hideLoader() {
    loader.style.display = "none";   // أو loader.remove();
    img.style.display = "block";
}

img.addEventListener("load", hideLoader);

img.addEventListener("error", () => {
    loader.innerText = "فشل تحميل الصورة";
});

// أول تحميل
loadImage("images/mutashabihat/1.jpg");
